server:
  port: 8080

spring:
  application:
    name: gearstock-erp
  datasource:
    url: jdbc:h2:mem:gearstockdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yR2VhclN0b2NrRVJQUHJvSldUQXV0aGVudGljYXRpb24yMDI2
  expiration: 86400000

logging:
  level:
    root: INFO
    com.gearstock: INFO
